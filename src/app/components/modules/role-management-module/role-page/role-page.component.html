<div class="full-page">
  <mat-card class="user-list-card">
    <mat-card-header class="header">
      <h2 class="title">Role Listing &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</h2>
      <br>
      <br>
      <mat-icon (click)="addRole()" >add_box</mat-icon>
      <form class="d-flex align-items-center search-form">
        <div class="form-group mb-0">
          <div class="input-group input-group-alternative">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fas fa-search"></i></span>
            </div>
            <input class="form-control" placeholder="Search" type="text" (input)="applyFilter($event)">
          </div>
        </div>
      </form>
    </mat-card-header>
    <mat-card-content class="content">
      <div class="mat-elevation-z8">
        <table mat-table class="table" matSort [dataSource]="dataSource">

          <!-- Role Type Column -->
          <ng-container matColumnDef="RoleType">
            <th mat-header-cell class="header-cell" mat-sort-header *matHeaderCellDef> Role Type </th>
            <td mat-cell class="cell" *matCellDef="let element">
               {{element.roleType}}
            </td>
          </ng-container>

          <!-- Permissions Column -->
          <ng-container matColumnDef="Permissions">
            <th mat-header-cell class="header-cell" *matHeaderCellDef> Permissions </th>
            <td mat-cell class="cell" *matCellDef="let element">
              <select>
                <option *ngFor="let permission of element?.permissions" [value]="permission?.id">
                  {{ permission?.permissionType }} - {{ permission?.permissionName }}
                </option>
              </select>
            </td>
          </ng-container>

          <!-- Action Column -->
          <ng-container matColumnDef="action">
            <th mat-header-cell class="header-cell" *matHeaderCellDef> Action </th>
            <td mat-cell class="cell" *matCellDef="let element">
              <mat-icon class="btn-gradient-bg" *ngIf="element.roleType" (click)="dialogPEr(element.id, element.permissions)" >update</mat-icon>
            </td>

          </ng-container>

          <!-- Delete Column -->
          <ng-container matColumnDef="delete">
            <th mat-header-cell class="header-cell" *matHeaderCellDef> Delete </th>
            <td mat-cell class="cell" *matCellDef="let element">
              <mat-icon class="btn-gradient-bg" (click)="deleteRole(element.id)">delete</mat-icon>
            </td>
          </ng-container>

          <tr mat-header-row class="header-row" *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row class="data-row" *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator class="paginator" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of periodic elements"></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
